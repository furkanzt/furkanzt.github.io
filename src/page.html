<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="color-scheme" content="light dark">
<link rel="canonical" href="{{canonical}}">
<link rel="alternate" hreflang="en" href="{{origin}}/en/">
<link rel="alternate" hreflang="tr" href="{{origin}}/tr/">
<link rel="alternate" hreflang="x-default" href="{{origin}}/">
<meta property="og:type" content="website">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:locale" content="{{og_locale}}">
<meta property="og:locale:alternate" content="{{og_locale_alt}}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f4fa8'/%3E%3Cpath d='M11 8h11v3.4h-7.2v3.3H21v3.3h-6.2V24H11z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="{{assets}}site.css">
</head>
<body data-force="{{force}}">
<div class="shell">
  <header class="top">
    <div class="lang" role="group" aria-label="{{toggle_label}}" data-k-label="toggle_label" hidden>
      <button type="button" data-lang="en" lang="en" aria-pressed="{{en_pressed}}">EN</button>
      <button type="button" data-lang="tr" lang="tr" aria-pressed="{{tr_pressed}}">TR</button>
    </div>
    <noscript>
      <nav class="lang-plain" aria-label="{{toggle_label}}">
        <a href="{{rel}}en/" hreflang="en" lang="en">English</a>
        <a href="{{rel}}tr/" hreflang="tr" lang="tr">Türkçe</a>
      </nav>
    </noscript>
  </header>
  <main>
    <h1>{{name}}</h1>
    <p class="lead" data-k="headline">{{headline}}</p>
    <p class="availability" data-k="availability">{{availability}}</p>
    <section class="status" aria-labelledby="status-title">
      <h2 id="status-title" data-k="status_title">{{status_title}}</h2>
      <p data-k="status_body">{{status_body}}</p>
      <ul class="contacts">
{{contacts}}
      </ul>
    </section>
  </main>
  <footer class="foot">
    <span data-k="location">{{location}}</span>
  </footer>
</div>
<script type="application/json" id="i18n">{{i18n_json}}</script>
<script src="{{assets}}site.js"></script>
</body>
</html>
